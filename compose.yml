services:
  game:
    image: mysql:5.6
    ports:
      - "8001:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "admin123@"
    command: --sql-mode=NO_ENGINE_SUBSTITUTION
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/backup:/dumps:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "--password=admin123@"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.0
    ports:
      - "8002:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "admin123@"
      MYSQL_DATABASE: cms
    volumes:
      - cms-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "--password=admin123@"]
      interval: 5s
      timeout: 5s
      retries: 30

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    image: php:8.3-fpm-alpine
    working_dir: /var/www
    volumes:
      - .:/var/www

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      game:
        condition: service_healthy
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  cms-data:
