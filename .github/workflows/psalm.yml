name: Psalm Security Scan

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  schedule:
    - cron: '24 13 * * 0'

permissions:
  contents: read

jobs:
  php-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # psalm/psalm-github-security-scan is PHP 8.2; this project requires 8.3
      # (vendor/composer/platform_check.php) plus ext-gd / ext-pdo_mysql.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: zip, gd, pdo_mysql
          coverage: none
          tools: composer, vimeo/psalm:6.18.0

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Psalm Security Scan
        run: psalm --output-format=github --taint-analysis --report=results.sarif --no-progress

      - name: Upload Security Analysis results to GitHub
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
