services:
  mt2:
    image: mysql:5.6
    ports:
      - "8001:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "admin123@"
    command: --sql-mode=NO_ENGINE_SUBSTITUTION
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/backup:/dumps:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "--password=admin123@"]
      interval: 5s
      timeout: 5s
      retries: 30

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mt2
    depends_on:
      mt2:
        condition: service_healthy

volumes:
  mysql-data:
