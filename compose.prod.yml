services:
  game:
    image: mysql:5.6
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}
      DB_USER: ${DB_USER:-mt2cms}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    command: --sql-mode=NO_ENGINE_SUBSTITUTION
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/backup:/dumps:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${CMS_MYSQL_ROOT_PASSWORD:?CMS_MYSQL_ROOT_PASSWORD required}
      MYSQL_DATABASE: cms
      MYSQL_USER: ${CMS_DB_USER:-cms}
      MYSQL_PASSWORD: ${CMS_DB_PASSWORD:?CMS_DB_PASSWORD required}
    volumes:
      - cms-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "--password=${CMS_MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: nginx
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - cms-uploads:/var/www/public/uploads:ro
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: php
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    working_dir: /var/www
    environment:
      APP_TRUST_PROXY: "1"
    volumes:
      - cms-var:/var/www/var
      - cms-uploads:/var/www/public/uploads
      - ./game:/var/www/game:ro
      - ./.env:/var/www/.env
    depends_on:
      mysql:
        condition: service_healthy
      game:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  cms-data:
  cms-var:
  cms-uploads:
