server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php index.html;

    client_max_body_size 512m;

    # Static assets only — HTML CSP/frame headers come from PHP Response
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Theme static assets (banners, etc.) — long cache; filenames are versioned by rebuild
    location ^~ /themes/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # User uploads (news images) — static only, no PHP execution
    location ^~ /uploads/ {
        try_files $uri =404;
    }

    location ~ ^/uploads/.*\.php$ {
        deny all;
    }

    # Download files live under var/downloads (served via PHP), not public/
    location ~ ^/downloads/.*\.php$ {
        deny all;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
    }

    location ~ /\. {
        deny all;
    }
}
